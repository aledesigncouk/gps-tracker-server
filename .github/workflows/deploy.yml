name: Deployment
on:
  push:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate .env file
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_TABLE_NAME: ${{ secrets.DB_TABLE_NAME }}
          API_KEY: ${{ secrets.API_KEY }}

        run: |
          echo "DB_HOST=${DB_HOST}" > .env
          echo "DB_USERNAME=${DB_USERNAME}" >> .env
          echo "DB_PASSWORD=${DB_PASSWORD}" >> .env
          echo "DB_NAME=${DB_NAME}" >> .env
          echo "DB_TABLE_NAME=${DB_TABLE_NAME}" >> .env
          echo "API_KEY=${API_KEY}" >> .env

      - name: FTP Deployer
        uses: sand4rt/ftp-deployer@v1.8
        with:
          sftp: false
          host: ${{ secrets.FTP_SERVER }}
          port: 21
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          remote_folder: ${{ secrets.REMOTE_FOLDER }}
          local_folder: "./"
          exclude: '[".github/**",".git/**", ".gitignore"," "composer.json", "composer.lock", "src/test/**", "docker-compose.yml","phpunit.yml", "README.md", "run-tests.sh"]'
          include: '["index.html","api/**"]'
          cleanup: false
          passive: true
